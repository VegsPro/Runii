name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: Runii
  VERSION_NAME: 1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Grant execute
        run: chmod +x gradlew

      - name: Build with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p output
          APK=$(find app/build/outputs -name "*release*.apk" | head -1)
          echo "Found: $APK"
          cp "$APK" output/${{ env.APP_NAME }}-${{ env.VERSION_NAME }}.apk
          ls -la output/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION_NAME }}
          path: output/${{ env.APP_NAME }}-${{ env.VERSION_NAME }}.apk
          retention-days: 30
