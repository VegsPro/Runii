name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: Runii
  VERSION_NAME: 1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "84831b94096441f7ae2d" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "d56f5187479451be63c5c3" > $ANDROID_HOME/licenses/android-googletv-license || true
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare artifact
        if: success()
        run: |
          mkdir -p output
          APK=$(find app/build/outputs -name "*release*.apk" | head -1)
          echo "Found APK: $APK"
          cp "$APK" "output/${{ env.APP_NAME }}-${{ env.VERSION_NAME }}.apk"
          ls -la output/

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION_NAME }}
          path: output/${{ env.APP_NAME }}-${{ env.VERSION_NAME }}.apk
          retention-days: 30
